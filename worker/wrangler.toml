# okay-chat-edge: `npx wrangler dev` here, after `scripts/data.sh` and `scripts/kv.sh --local`
name = "okay-chat-edge"
main = "entry.js"
compatibility_date = "2026-10-01"
# the files the Worker carries: okay-chat's JSON as text (".json.txt": wrangler would parse a .json)
rules = [{ type = "Text", globs = ["**/*.json.txt"], fallthrough = false }]

# the web page (public/: index.html, style.css, page.js by `sbt pageJs`) — static assets, served before the Worker,
# free and outside the requests a day; what is not a file there (/c/…, /telegram) reaches the Worker
[assets]
directory = "./public"

# the space a listing's subject is matched in: "trigrams" (no model; what wrangler dev has) or "ai" (Workers AI's
# bge-m3, multilingual — with the AI binding below, on a Cloudflare account)
# bge-m3 costs ~1075 neurons a million tokens: a message ~0.02 of the free plan's 10 000 a day
[vars]
EMBED = "ai"
# the model lane: what the edge does not act on itself (src/main/scala/okaychatedge/Lane.scala); "" — none
LANE = "@cf/google/gemma-4-26b-a4b-it"

[ai]
binding = "AI"

# the static table: one value, `static` (scripts/kv.sh puts it)
[[kv_namespaces]]
binding = "TABLE"
id = "38f4aeec5adc4cf5802f6ef9e9095ef9"

# a conversation an object, a deal an object, the deals' numbers an object — SQLite under each (the free plan's kind)
[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "Conversation"

[[durable_objects.bindings]]
name = "DEALS"
class_name = "Deal"

[[durable_objects.bindings]]
name = "NUMBERS"
class_name = "Numbers"

# the model lane's day: one object counting its replies (LANE_DAILY, 2000 unless set)
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Conversation"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Deal", "Numbers"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Budget"]

# the employers' boards imported one a tick, a remembered vacancy search asked again (src/main/scala/.../Boards.scala)
[triggers]
crons = ["*/2 * * * *"]

# the market: every offer and need a listing (D1: on the free plan)
[[d1_databases]]
binding = "MARKET"
database_name = "okay-chat-edge-market"
database_id = "ae0fcd7f-6b15-4065-88e9-d523794151f1"
